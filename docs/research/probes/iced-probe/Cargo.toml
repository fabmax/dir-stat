[package]
name = "iced-probe"
version = "0.1.0"
edition = "2024"
# iced 0.14.0 declares rust-version = "1.88" and edition 2024
rust-version = "1.88"
publish = false

[dependencies]
# Default features (wgpu, tiny-skia, crisp, web-colors, thread-pool,
# linux-theme-detection, x11, wayland) are kept on purpose.
#   tokio  -> futures executor = tokio multi-thread runtime; required for iced::time::every
#   canvas -> iced::widget::canvas (treemap / bar visualisation)
#   lazy   -> iced::widget::lazy (only probed here; optional for the real app)
iced = { version = "0.14", features = ["tokio", "canvas", "lazy"] }
# Native folder picker. Default features (xdg-portal + wayland) are fine for Linux.
rfd = "0.17"
# `reveal` feature is REQUIRED for opener::reveal (Show in Finder / file manager).
opener = { version = "0.9", features = ["reveal"] }
# Move to Trash / Recycle Bin.
trash = "5"
# Only for tokio::task::spawn_blocking inside Task::perform (iced already pulls tokio in).
tokio = { version = "1", features = ["rt", "time"] }

# Probe-only: encode iced window screenshots to PNG for visual verification.
png = "0.18"

[profile.dev]
# Make debug builds usable for a GUI that walks thousands of files.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
cosmic-text = "0.15"

[features]
# Enables the expected-to-FAIL compile tests in negative/ (see run-negative.sh)
negative = []

[[example]]
name = "neg_application_title_first"
path = "negative/neg_application_title_first.rs"
required-features = ["negative"]

