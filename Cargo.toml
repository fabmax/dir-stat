[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# iced 0.14's MSRV. Build with a current stable: DirEntry::metadata() is fstatat-relative
# only in newer releases (design §2.2).
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[profile.dev]
# Keeps debug builds of the GUI and the scanner usable.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
